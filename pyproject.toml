[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indoor-garden-kit"
version = "0.1.0"
description = "Open-source libraries for indoor garden automation"
requires-python = ">=3.12"
license = "MIT"

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]
